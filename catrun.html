7,oldCat:"安全",title:"紐・輪ゴムは腸閉塞",shortTip:"線状異物は腸を裂く。遊んだ後は片付け、飲んだら即病院。"},{id:28,oldCat:"安全",title:"窓は脱走1位",shortTip:"網戸は破れる。突っ張り式柵＋ロックを。2階以上は落下も。"},{id:29,oldCat:"安全",title:"アロマ・香りは肝臓に負担",shortTip:"ティーツリー・ユーカリ等は中毒。無香が最安・最安全。"},{id:30,oldCat:"安全",title:"コードは苦いテープで保護",shortTip:"噛み癖ある子は配線カバー＋苦味スプレーで感電予防。"},{id:31,oldCat:"遊び",title:"おもちゃは狩りの4段階",shortTip:"じらし→追わせる→捕まえさせる→食餌で完結。満足度MAX。"},{id:32,oldCat:"遊び",title:"レーザーは不満が残る",shortTip:"捕まえられないのでフラストレーション。最後は物理おもちゃで締める。"},{id:33,oldCat:"遊び",title:"1日15分で問題行動半減",shortTip:"朝晩5-10分ずつ。羽根・紐・ボールを使い分ける。"},{id:34,oldCat:"遊び",title:"同じおもちゃは飽きる",shortTip:"3セットをローテ。2日おきに入れ替えで新鮮さ維持。"},{id:35,oldCat:"遊び",title:"手で遊ばない",shortTip:"手を噛む癖がつく。必ず棒や投げるおもちゃ経由。"},{id:36,oldCat:"環境",title:"トイレは頭数+1",shortTip:"1匹なら2個、2匹なら3個。静かで人通りの少ない場所に。"},{id:37,oldCat:"環境",title:"トイレ掃除は毎回",shortTip:"猫は綺麗好き。汚れていると我慢して膀胱炎に。固まったらすぐ取る。"},{id:38,oldCat:"環境",title:"砂は好みを尊重",shortTip:"鉱物系が人気だが粉塵あり。紙・木・おからを試す。"},{id:39,oldCat:"環境",title:"隠れ家を3カ所",shortTip:"寝室・リビング・高所に箱やベッド。選択肢で安心感UP。"},{id:40,oldCat:"環境",title:"温度は20-28℃が適温",shortTip:"寒がりで暑がり。冬は毛布、夏は風通し＋ひんやりマット。"},{id:41,oldCat:"しつけ",title:"叩く・怒鳴るは逆効果",shortTip:"恐怖で関係悪化。望まない行動は無視、正しい行動を即褒める。"},{id:42,oldCat:"しつけ",title:"カウンターは登れて当然",shortTip:"高い所が好き。別に魅力的な高所を用意して誘導。"},{id:43,oldCat:"しつけ",title:"朝4時に起こされる対策",shortTip:"寝る前に満腹＋激遊び、朝は自動給餌器で人以外の報酬に。"},{id:44,oldCat:"しつけ",title:"噛み癖は遊び不足",shortTip:"子猫期に学習できず。痛かったら遊びを即終了で教える。"},{id:45,oldCat:"しつけ",title:"爪切りは寝起きに1本ずつ",shortTip:"無理に全部はNG。1本切っておやつ、翌日また1本でOK。"},{id:46,oldCat:"季節",title:"春は抜け毛祭り",shortTip:"ブラッシング1日1回で毛玉嘔吐予防。抜けた毛は誤飲させない。"},{id:47,oldCat:"季節",title:"夏は脱水に注意",shortTip:"水場を3カ所。ウェット＋ぬるま湯で水分確保。"},{id:48,oldCat:"季節",title:"冬は静電気でパチッ",shortTip:"金属に触れる前に加湿。ブラッシング前に手でなでて放電。"},{id:49,oldCat:"季節",title:"秋は食欲増で肥満に注意",shortTip:"冬支度で食べ過ぎる。量は変えず遊びを増やす。"},{id:50,oldCat:"子猫",title:"子猫は社会化期が勝負",shortTip:"2-9週齢に人・音・他猫に慣らすと一生の性格が決まる。"},{id:51,oldCat:"子猫",title:"子猫は3時間おきに給餌",shortTip:"生後4週まではミルク、離乳後は子猫用高カロリーフード。"},{id:52,oldCat:"子猫",title:"子猫のトイレは低く",shortTip:"縁が低いトレーで失敗させない。成功体験が早覚えの
