<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1018">
  <meta name="description" content="撮影イベントの時間超過を自動検知し、次のキューへ進む現場向け進行管理アプリ">
<link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./pwa-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./pwa-icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Event Flow Auto Queue</title>
  <style>
    /* Design: ダーク・ミスト・コンソール。現在・次・遅延を最短の視線で判断できる、低照度現場向けの操作面。特大文字は現場の現在キューだけで使い、管理画面の密度は標準に保つ。 */
    :root {
      --canvas:#0b1018; --canvas-soft:#111a27; --panel:rgba(20,30,45,.82); --panel-strong:rgba(27,40,59,.92);
      --ink:#f5f8fc; --muted:#a2b0c4; --faint:#6f7f95; --line:rgba(174,201,237,.14); --line-strong:rgba(174,201,237,.25);
      --mint:#46d6b0; --mint-deep:#22ab8a; --blue:#77a1ff; --violet:#9b8bff; --amber:#f2bd5b; --rose:#ff718d;
      --shadow:0 20px 45px rgba(0,0,0,.34); --radius-lg:24px; --radius-md:16px; --radius-sm:12px;
      --ease:cubic-bezier(.23,1,.32,1);
    }
    * { box-sizing:border-box }
    html { background:var(--canvas); color-scheme:dark; -webkit-text-size-adjust:100%; text-size-adjust:100% }
    body { margin:0; min-width:320px; color:var(--ink); font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif; background:var(--canvas); letter-spacing:.01em }
    body:before { content:""; position:fixed; inset:0; z-index:-2; pointer-events:none; background:radial-gradient(circle at 6% 0%,rgba(57,96,180,.27),transparent 30rem),radial-gradient(circle at 94% 3%,rgba(78,174,163,.13),transparent 26rem),linear-gradient(145deg,#101826 0%,#0b1018 52%,#0c121b 100%) }
    body:after { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.38; background-image:linear-gradient(rgba(173,199,235,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(173,199,235,.055) 1px,transparent 1px); background-size:38px 38px; mask-image:linear-gradient(#000,transparent 72%); -webkit-mask-image:linear-gradient(#000,transparent 72%) }
    button,input,select,textarea { font:inherit }
    button { cursor:pointer }
    button,.btn,.icon-btn,.map-link,.nav button,label.settings-line,[data-action] { touch-action:manipulation; -webkit-tap-highlight-color:transparent }
    button:disabled { cursor:not-allowed; opacity:.45 }
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid rgba(119,161,255,.45); outline-offset:2px }
    .app { width:min(1500px,calc(100% - 32px)); min-height:100vh; margin:0 auto; display:grid; grid-template-columns:248px minmax(0,1fr); gap:24px }
    .sidebar { position:sticky; top:16px; height:calc(100vh - 32px); margin:16px 0; padding:20px 14px 15px; display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--line); border-radius:var(--radius-lg); background:linear-gradient(145deg,rgba(28,41,60,.86),rgba(14,22,34,.89)); box-shadow:var(--shadow); backdrop-filter:blur(22px) }
    .sidebar:after { content:""; position:absolute; width:220px; height:220px; top:-136px; right:-104px; border-radius:50%; background:radial-gradient(circle,rgba(119,161,255,.27),transparent 68%); pointer-events:none }
    .brand { position:relative; z-index:1; display:flex; align-items:center; gap:12px; padding:4px 9px 27px }.brand:after { content:""; position:absolute; left:60px; right:11px; bottom:14px; height:1px; background:linear-gradient(90deg,rgba(70,214,176,.55),rgba(119,161,255,.20),transparent) }
    .brand-mark { position:relative; width:46px; height:46px; padding:8px; display:grid; place-items:center; flex:0 0 auto; border-radius:15px; background:linear-gradient(145deg,#5d81dc,#46d6b0); box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 12px 25px rgba(44,103,195,.30) }
    .brand-mark:before { content:""; position:absolute; inset:6px; border:1px solid rgba(255,255,255,.45); border-radius:50%; opacity:.55 }
    .brand-mark:after { content:""; position:absolute; right:-17px; top:20px; width:13px; height:1px; background:linear-gradient(90deg,rgba(70,214,176,.85),transparent) }
    .brand-mark svg { width:100%; height:100%; fill:none; stroke:white; stroke-width:2.45; stroke-linecap:round; stroke-linejoin:round }
    .brand b { display:block; font-family:"Arial Rounded MT Bold","Hiragino Sans",sans-serif; font-size:16px; letter-spacing:-.05em }
    .brand small { display:block; margin-top:4px; font-size:9px; color:var(--faint); font-weight:850; letter-spacing:.15em }
    .nav-label { margin:0 10px 8px; color:var(--faint); font-size:9px; font-weight:900; letter-spacing:.16em }
    .nav { display:grid; gap:4px }
    .nav button { position:relative; width:100%; display:flex; align-items:center; gap:11px; padding:12px 11px; color:var(--muted); border:0; border-radius:12px; background:transparent; text-align:left; font-size:12.5px; font-weight:790; transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease) }
    .nav button:hover { color:var(--ink); background:rgba(255,255,255,.06); transform:translateX(2px) }
    .nav button.active { color:#b9ccff; background:linear-gradient(90deg,rgba(96,145,255,.2),rgba(96,145,255,.03)) }
    .nav button.active:before { content:""; position:absolute; left:0; width:3px; height:18px; border-radius:9px; background:linear-gradient(var(--blue),var(--mint)) }.nav button.active:after { content:"›"; position:absolute; right:10px; color:var(--mint); font-family:"SFMono-Regular",Consolas,monospace; font-size:18px; font-weight:700 }
    .nav-icon { width:18px; display:grid; place-items:center; font-size:16px; font-weight:500 }
    .side-foot { position:relative; z-index:1; margin-top:auto; padding:16px 10px 3px; border-top:1px solid var(--line); color:var(--muted); font-size:10.5px; line-height:1.65 }
    .side-foot b { display:block; color:var(--ink); font-size:10.5px }
    .side-foot span { color:var(--faint) }
    main { min-width:0; padding:27px 4px 48px }
    .topbar { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; padding:0 7px 23px }
    .eyebrow { color:var(--faint); font-size:9px; font-weight:900; letter-spacing:.17em }
    .page-title { margin:6px 0 0; color:var(--ink); font-size:clamp(27px,3vw,40px); line-height:1; letter-spacing:-.065em; font-weight:850 }
    .page-title em { font-style:normal; color:var(--mint) }
.header-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap }
.clock { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; font-weight:760; font-variant-numeric:tabular-nums }
    /* Field FAB: 現場モードでのみ、スクロール位置に依存せずキュー追加を呼び出す。 */
    #addButton.field-fab { position:fixed; right:max(18px,env(safe-area-inset-right)); bottom:max(18px,env(safe-area-inset-bottom)); z-index:90; min-height:48px; padding:0 17px; border-radius:15px; box-shadow:0 13px 28px rgba(4,13,22,.48),0 0 0 1px rgba(213,255,246,.18); transform:translateZ(0) } #addButton.field-fab:active { transform:translateZ(0) scale(.96) }
    .clock b { color:var(--ink); font-size:16px; letter-spacing:-.02em }
    .btn { min-height:40px; border:1px solid var(--line-strong); border-radius:12px; padding:9px 12px; color:var(--muted); background:rgba(255,255,255,.05); font-size:11.5px; font-weight:820; transition:transform .16s var(--ease),background .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease) }
    .btn:hover { color:var(--ink); background:rgba(255,255,255,.1); box-shadow:0 8px 18px rgba(0,0,0,.22); transform:translateY(-1px) }
    .btn:active { transform:scale(.97) }
    .btn.primary { color:#081718; border-color:transparent; background:linear-gradient(130deg,#61e0bf,#39beaa); box-shadow:0 9px 20px rgba(40,191,158,.22) }
    .btn.primary:hover { color:#061212; background:linear-gradient(130deg,#76edcd,#42cbb5) }
    .btn.blue { color:#dce8ff; border-color:rgba(119,161,255,.34); background:rgba(73,108,184,.18); box-shadow:none }
    .btn.danger { color:#ff9eaf; border-color:rgba(255,113,141,.29); background:rgba(255,113,141,.09) }
    .btn.small { min-height:33px; padding:6px 9px; border-radius:10px; font-size:10.5px }
    /* Staff share view: 読み取り専用。現在・次・遅延・締切だけを、操作卓の情報密度で共有する。 */
    .staff-share-shell { width:min(820px,calc(100% - 32px)); min-height:100vh; margin:0 auto; padding:26px 0 calc(36px + env(safe-area-inset-bottom)); }
    .app.staff-share-app { display:block; width:auto; min-height:100vh; margin:0 }
    .staff-share-top { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:0 4px 20px; border-bottom:1px solid var(--line) }
    .staff-share-brand { display:flex; align-items:center; gap:10px; color:var(--ink); font-weight:850; letter-spacing:-.04em }.staff-share-brand i { display:grid; width:31px; height:31px; place-items:center; color:#061212; border-radius:10px; background:linear-gradient(145deg,#77e8c9,#38baa7); font-style:normal }
    .staff-share-kicker { color:var(--faint); font-size:9px; font-weight:900; letter-spacing:.17em }.staff-share-updated { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; text-align:right }
    .staff-share-event { margin:23px 0 14px }.staff-share-event h1 { margin:5px 0 0; font-size:clamp(26px,7vw,42px); line-height:1.03; letter-spacing:-.065em }.staff-share-event p { margin:9px 0 0; color:var(--muted); font-size:13px }
    .staff-share-grid { display:grid; grid-template-columns:1.18fr .82fr; gap:13px }.staff-share-cue { position:relative; min-height:158px; overflow:hidden; padding:21px; border:1px solid var(--line-strong); border-radius:var(--radius-md); background:linear-gradient(145deg,rgba(25,41,61,.92),rgba(13,22,34,.92)); box-shadow:var(--shadow) }.staff-share-cue.current { border-color:rgba(70,214,176,.65); background:linear-gradient(145deg,rgba(33,75,78,.54),rgba(16,28,42,.95)) }.staff-share-cue.next { border-color:rgba(119,161,255,.32) }.staff-share-cue:before { content:""; position:absolute; left:0; top:17px; bottom:17px; width:3px; background:var(--blue) }.staff-share-cue.current:before { background:var(--mint) }.staff-share-cue span { display:block; color:var(--faint); font-size:9px; font-weight:900; letter-spacing:.16em }.staff-share-cue h2 { margin:12px 0 0; font-size:clamp(21px,5vw,32px); line-height:1.08; letter-spacing:-.055em }.staff-share-cue .staff-share-time { margin-top:11px; color:var(--mint); font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:14px; font-weight:900 }.staff-share-cue.next .staff-share-time { color:#a9beff }.staff-share-cue p { margin:10px 0 0; color:var(--muted); font-size:12px; line-height:1.55 }
    .staff-share-rail { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:13px }.staff-share-metric { padding:13px 14px; border:1px solid var(--line); border-radius:13px; background:rgba(18,28,42,.67) }.staff-share-metric span { display:block; color:var(--faint); font-size:9px; font-weight:900; letter-spacing:.13em }.staff-share-metric b { display:block; margin-top:7px; color:var(--ink); font-size:16px; letter-spacing:-.04em }.staff-share-metric.warn b { color:var(--amber) }.staff-share-metric.over b { color:var(--rose) }.staff-share-shell:before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background:linear-gradient(160deg,rgba(33,61,85,.44),transparent 31%),linear-gradient(90deg,transparent 0,transparent 49%,rgba(119,161,255,.035) 50%,transparent 51%); background-size:auto,36px 36px }.staff-share-empty { position:relative; overflow:hidden; margin-top:18vh; padding:24px 24px 20px; border:1px solid rgba(119,161,255,.23); border-left:3px solid var(--mint); border-radius:12px; color:var(--muted); text-align:left; background:rgba(13,23,36,.82); box-shadow:none }.staff-share-empty:before { content:"◇› LINK STATUS"; display:block; margin-bottom:11px; color:#aec4e7; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:9px; font-weight:900; letter-spacing:.15em }.staff-share-empty b { display:block; color:var(--ink); font-size:21px; letter-spacing:-.045em }.staff-share-empty p { margin:7px 0 0; font-size:12px; line-height:1.6 }.staff-share-empty .staff-empty-rail { display:flex; align-items:center; gap:8px; margin-top:17px; padding-top:10px; border-top:1px solid rgba(174,201,237,.12); color:#9ddfce; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:9px; font-weight:900; letter-spacing:.1em }.staff-share-empty .staff-empty-rail i { width:7px; height:7px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 4px rgba(70,214,176,.10) }.staff-share-empty.is-error { border-left-color:var(--amber) }.staff-share-empty.is-error .staff-empty-rail { color:#f4cc84 }.staff-share-empty.is-error .staff-empty-rail i { background:var(--amber); box-shadow:0 0 0 4px rgba(242,189,91,.10) }
    @media (max-width:620px) { .staff-share-shell { width:min(100% - 24px,820px); padding-top:18px }.staff-share-grid { grid-template-columns:1fr }.staff-share-rail { grid-template-columns:1fr 1fr }.staff-share-metric:last-child { grid-column:1/-1 }.staff-share-cue { min-height:0 }.staff-share-top { padding-bottom:15px } }
    /* Staff timeline: 未完了を既定で前景化し、経緯が必要な時だけ完了項目を展開する。 */
    .staff-timeline-panel { margin-top:13px; padding:13px 14px; border:1px solid rgba(174,201,237,.13); border-radius:12px; background:rgba(13,23,36,.72) }.staff-timeline-head { display:flex; align-items:center; justify-content:space-between; gap:10px }.staff-timeline-head span { display:block; color:var(--faint); font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:8px; font-weight:900; letter-spacing:.14em }.staff-timeline-head b { display:block; margin-top:4px; color:var(--ink); font-size:14px }.staff-completed-toggle { min-height:34px; padding:7px 9px; border:1px solid rgba(119,161,255,.28); border-radius:9px; color:#c8d8f6; background:rgba(119,161,255,.09); font-size:10px; font-weight:850; transition:transform .16s var(--ease),background .16s var(--ease) }.staff-completed-toggle:active { transform:scale(.97) }.staff-timeline { display:grid; gap:0; margin:12px 0 0; padding:0; list-style:none }.staff-timeline-item { display:grid; grid-template-columns:12px 58px minmax(0,1fr) auto; align-items:center; gap:8px; min-height:44px; border-top:1px solid rgba(174,201,237,.09) }.staff-timeline-item:first-child { border-top:0 }.staff-timeline-marker { width:7px; height:7px; border:1px solid rgba(174,201,237,.42); border-radius:50% }.staff-timeline-item.active .staff-timeline-marker { border-color:var(--mint); background:var(--mint); box-shadow:0 0 0 4px rgba(70,214,176,.10) }.staff-timeline-item.done .staff-timeline-marker { border-color:rgba(174,201,237,.23); background:rgba(174,201,237,.16) }.staff-timeline-item.skipped .staff-timeline-marker { border-color:var(--amber); background:rgba(242,189,91,.25) }.staff-timeline-item time { color:#aec3e2; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:11px; font-weight:850 }.staff-timeline-item b { overflow:hidden; color:var(--ink); font-size:12px; text-overflow:ellipsis; white-space:nowrap }.staff-timeline-item small { color:var(--faint); font-size:9px; font-weight:800 }.staff-timeline-item.is-completed { opacity:.54 }.staff-timeline-item.is-completed b { text-decoration:line-through; text-decoration-color:rgba(174,201,237,.35) }.staff-timeline-empty { padding:11px 0 2px; color:var(--muted); font-size:11px }
    /* Share QR: スタッフのカメラで即座に読める、明背景・太い余白の現場用コード。 */
    .share-qr-wrap { display:grid; justify-items:center; gap:14px; margin-top:16px }.share-qr-sheet { width:min(100%,330px); padding:14px; border:1px solid rgba(70,214,176,.42); border-radius:14px; background:#f6fcff; box-shadow:0 12px 30px rgba(0,0,0,.26) }.share-qr-sheet svg { display:block; width:100%; height:auto; aspect-ratio:1; background:#f6fcff }.share-qr-kicker { color:#96e6d3; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:9px; font-weight:900; letter-spacing:.14em }.share-qr-copy { width:100%; overflow:hidden; padding:10px 11px; border:1px solid var(--line); border-radius:10px; color:#b9c8dc; background:rgba(255,255,255,.035); font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:10px; line-height:1.5; text-overflow:ellipsis; white-space:nowrap }.share-qr-note { margin:0; color:var(--muted); font-size:11px; line-height:1.55; text-align:center }.share-qr-actions { display:flex; width:100%; gap:8px }.share-qr-actions .btn { flex:1 }
    @media (max-width:620px) { .staff-share-shell { width:100%; padding:0 12px calc(24px + env(safe-area-inset-bottom)) }.staff-share-top { position:sticky; top:0; z-index:10; margin:0 -12px; padding:12px; background:rgba(11,16,24,.92); backdrop-filter:blur(14px) }.staff-share-event { margin:18px 2px 12px }.staff-share-event h1 { font-size:clamp(27px,9vw,38px); line-height:1.02 }.staff-share-grid { gap:8px }.staff-share-cue { padding:16px; border-radius:12px }.staff-share-cue.current { min-height:144px }.staff-share-cue h2 { font-size:clamp(24px,7vw,31px) }.staff-share-cue.next h2 { font-size:20px }.staff-share-rail { grid-template-columns:1.2fr .8fr; gap:7px }.staff-share-metric { padding:11px; border-radius:10px }.staff-timeline-item { grid-template-columns:12px 52px minmax(0,1fr); gap:7px }.staff-timeline-item small { grid-column:3; margin-top:-6px; padding-bottom:7px } }
    .view { display:none }
    .view.active { display:block; animation:enter .26s var(--ease) both }
    @keyframes enter { from { opacity:0; transform:translateY(7px) } to { opacity:1; transform:translateY(0) } }
    .auto-banner { display:none; align-items:center; gap:11px; margin:0 0 15px; padding:13px 15px; border:1px solid rgba(255,113,141,.38); border-radius:var(--radius-md); color:#ffd5dd; background:linear-gradient(105deg,rgba(255,113,141,.19),rgba(255,113,141,.05)); box-shadow:0 10px 24px rgba(103,27,43,.2) }
    .auto-banner.show { display:flex; animation:handoff .35s var(--ease) both }
    @keyframes handoff { from { opacity:0; transform:translateY(-7px) } to { opacity:1; transform:translateY(0) } }
    .auto-banner .icon { width:28px; height:28px; display:grid; place-items:center; flex:0 0 auto; border-radius:9px; color:#fff; background:rgba(255,113,141,.28); font-size:14px }
    .auto-banner b { display:block; font-size:12px }
    .auto-banner span { display:block; margin-top:3px; color:#deb1ba; font-size:10.5px }
    .field-grid { display:grid; grid-template-columns:minmax(0,1.62fr) minmax(250px,.62fr); gap:17px; align-items:start }
    .glass { border:1px solid var(--line); box-shadow:var(--shadow); background:linear-gradient(145deg,rgba(35,50,71,.75),rgba(17,26,40,.79)); backdrop-filter:blur(18px) }
    .now-card { position:relative; overflow:hidden; padding:27px; border-radius:var(--radius-lg); border-color:rgba(70,214,176,.42); background:linear-gradient(145deg,rgba(22,54,62,.94),rgba(16,27,43,.97) 58%,rgba(10,18,30,.98)); box-shadow:0 27px 64px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.05) }
    .now-card:before { content:""; position:absolute; right:-130px; bottom:-210px; width:370px; height:370px; border-radius:50%; background:radial-gradient(circle,rgba(70,214,176,.15),transparent 67%) }
    .now-card:after { content:""; position:absolute; right:34px; top:-155px; width:240px; height:240px; border-radius:50%; background:radial-gradient(circle,rgba(119,161,255,.17),transparent 68%) }
    .now-card > * { position:relative; z-index:1 }
    .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px }
    .cue-index { position:relative; display:grid; place-items:center; width:35px; height:35px; border:1px solid rgba(119,161,255,.26); border-radius:11px; color:#b5c9ff; background:rgba(119,161,255,.12); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:13px; font-weight:900 }
    .cue-index:before { content:""; position:absolute; inset:6px; border:1px solid rgba(119,161,255,.34); border-radius:50%; opacity:.55 }
    .cue-index:after { content:"◇›"; position:absolute; right:-28px; color:rgba(119,161,255,.72); font-family:"SFMono-Regular",Consolas,monospace; font-size:11px; letter-spacing:-.18em }
    .status-pill { display:inline-flex; align-items:center; gap:6px; min-height:27px; padding:5px 9px; border-radius:999px; color:#91efd7; background:rgba(70,214,176,.13); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:10px; font-weight:880; letter-spacing:.04em }
    .status-pill:before { content:""; width:6px; height:6px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 4px rgba(70,214,176,.1) }
    .cue-name { max-width:740px; margin:15px 0 0; font-size:clamp(25px,3.3vw,39px); line-height:1.11; letter-spacing:-.055em; word-break:break-word }

    /* Next 30: 次キュー直前の30秒だけを別レールで読む。 */
    .next-thirty { margin-top:10px; padding:10px 11px; border:1px solid rgba(119,161,255,.20); border-radius:11px; background:rgba(8,16,27,.48) }.next-thirty-head { display:flex; align-items:center; justify-content:space-between; gap:10px }.next-thirty-head span { color:#a9c0ea; font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:8px; font-weight:900; letter-spacing:.13em }.next-thirty-head b { color:#dfeaff; font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:10px; font-variant-numeric:tabular-nums }.next-thirty-copy { display:flex; justify-content:space-between; gap:10px; margin-top:5px; color:var(--muted); font-size:10px; line-height:1.4 }.next-thirty-copy strong { overflow:hidden; color:#e2ecfb; font-size:10.5px; text-overflow:ellipsis; white-space:nowrap }.next-thirty-track { height:5px; overflow:hidden; margin-top:8px; border-radius:999px; background:rgba(255,255,255,.07) }.next-thirty-track i { display:block; width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--blue),var(--mint)); transition:width .35s linear,background .2s var(--ease) }.next-thirty.soon { border-color:rgba(242,189,91,.46); background:linear-gradient(90deg,rgba(242,189,91,.12),rgba(8,16,27,.48)) }.next-thirty.soon .next-thirty-head b { color:#ffdda0 }.next-thirty.soon .next-thirty-track i { background:linear-gradient(90deg,#d89b38,var(--amber)) }.next-thirty.urgent { border-color:rgba(255,113,141,.55); background:linear-gradient(90deg,rgba(255,113,141,.16),rgba(8,16,27,.48)) }.next-thirty.urgent .next-thirty-head b { color:#ffc0cd }.next-thirty.urgent .next-thirty-track i { background:linear-gradient(90deg,#df5e78,var(--rose)) }.next-thirty.overdue .next-thirty-head b { color:#ffadbd }.next-thirty.overdue .next-thirty-track i { width:100%!important; background:var(--rose) }
    .field-view-toggle { min-height:27px; padding:4px 7px; border:1px solid rgba(119,161,255,.27); border-radius:8px; color:#c4d5f6; background:rgba(119,161,255,.09); font-family:"SFMono-Regular",Consolas,"Roboto Mono",monospace; font-size:8px; font-weight:900; letter-spacing:.06em; transition:transform .15s var(--ease),background .15s var(--ease) }.field-view-toggle:active { transform:scale(.96) }.field-view-toggle.active { color:#261217; border-color:transparent; background:#ffb0c0 }
    /* Emergency Console: 現在・次・必須だけへ情報を圧縮する。 */

          if(seen.has(key))warnings.push(`${item.index+1}行目「${item.title}」：同名・同時刻の重複候補です（自動削除はしません）。`);seen.add(key);
          if(item.type==='slot'){
            if(previousSlot&&startMin(item)<endMin(previousSlot))warnings.push(`時間が重複：「${previousSlot.title}」と「${item.title}」。このアプリは1列で進行します。複数会場なら取込後に撮影対象へ整理してください。`);
            if(previousSlot&&startMin(item)>endMin(previousSlot))warnings.push(`時間枠の空白：${previousSlot.end}〜${item.start}（${startMin(item)-endMin(previousSlot)}分）。休憩は自動追加しません。`);
            if(!previousSlot||endMin(item)>endMin(previousSlot))previousSlot=item;
          }
          if(item.type==='terminal'&&previousSlot&&startMin(item)<endMin(previousSlot))errors.push('終端の時刻より後まで続く時間枠があります。');
        });
        if(errors.length)throw new Error(errors.join('\n'));
        if(items.some(x=>x.type==='info'))warnings.push('案内キューは所要時間なしです。現場モードで「確認済み・次へ」を押して進めます。');
        return {name,date,venue,items:sorted,warnings:[...new Set(warnings)]};
      }
      function openTimetableImport() {
        openModal(`<div class="modal-head"><div><h2 id="modalTitle">AIタイムテーブル読込</h2><p>① 画像と指示文をAIチャットへ → ② JSONを読み込む → ③ 確認して新規追加</p></div><button class="modal-close" data-action="close-modal">×</button></div>
          <details class="tt-help"><summary>AIへの変換指示文・使い方</summary><p>この指示文をコピーし、タイムテーブル画像と一緒にAIチャットへ貼り付けてください。このアプリからAIへの送信は行いません。</p><textarea id="ttPrompt" readonly aria-label="AIへの変換指示文">${esc(TT_PROMPT)}</textarea><div class="tt-actions"><button class="btn small" type="button" id="ttCopy">指示文をコピー</button><button class="btn small" type="button" id="ttPromptDownload">指示文を保存</button><button class="btn small" type="button" id="ttSample">添付画像のサンプルJSON</button></div><p>サンプルはFREEDOM vol.20の22件です。開催日・会場は未設定、固有名詞は要確認です。保存したJSONを下で選択してください。</p></details>
          <div class="form-field"><label for="ttFile">JSONファイル（最大2MB・500件）</label><input id="ttFile" type="file" accept=".json,application/json"></div>
          <div class="form-field" style="margin-top:12px"><label for="ttJson">またはJSONを貼り付け・修正</label><textarea id="ttJson" spellcheck="false" placeholder='{"format":"event-flow-timetable","version":1,...}'></textarea></div>
          <div class="tt-actions"><button class="btn primary" id="ttCheck" type="button">内容を確認する</button></div><div id="ttError" class="tt-error" role="alert"></div><div id="ttPreview"></div>`);
        let draft=null,readSequence=0;
        const jsonInput=$('#ttJson'),fileInput=$('#ttFile'),preview=$('#ttPreview'),errorBox=$('#ttError');
        const invalidate=()=>{draft=null;preview.innerHTML='';errorBox.textContent='';};
        jsonInput.addEventListener('input',()=>{readSequence++;invalidate();});
        const check=()=>{
          invalidate();
          try{draft=parseTimetable(jsonInput.value);}catch(error){errorBox.textContent=error.message;return;}
          preview.innerHTML=`<h3>${draft.items.length}件の予定を確認</h3><p class="tt-help">既存イベントは変更しません。新規イベントは自動進行OFF・共有OFFで作成し、通知予定は自動送信しません。</p>
            <div class="form-grid"><div class="form-field full"><label for="ttName">イベント名 *</label><input id="ttName" maxlength="200" required value="${esc(draft.name)}"></div><div class="form-field"><label for="ttDate">開催日 *</label><input id="ttDate" type="date" min="1900-01-01" max="9999-12-31" required value="${esc(draft.date)}"></div><div class="form-field"><label for="ttVenue">会場</label><input id="ttVenue" maxlength="300" value="${esc(draft.venue)}"></div></div>
            ${draft.warnings.length?`<p class="tt-warning">${esc(draft.warnings.join('\n'))}</p>`:''}
            <ol class="tt-list">${draft.items.map(item=>`<li><time>${item.dayOffset?`+${item.dayOffset}日 `:''}${esc(item.start)}${item.end?` → ${item.endDayOffset!==item.dayOffset?`+${item.endDayOffset}日 `:''}${esc(item.end)} (${item.duration}分)`:` · ${item.type==='terminal'?'終端・手動完了':'案内・手動確認'}`}</time><b>${esc(item.title)}</b>${item.needsReview?' <span class="tag amber">要確認</span>':''}<small>${esc([item.area?'場所: '+item.area:'',item.genre?'ジャンル: '+item.genre:'',item.vj?'VJ: '+item.vj:'',item.note].filter(Boolean).join('\n'))}</small></li>`).join('')}</ol>
            <label class="tt-confirm"><input id="ttConfirmed" type="checkbox">画像と時刻・名前・日付・注意事項を照合しました。要修正の場合は上のJSONを直して再確認してください。</label><div id="ttCommitError" class="tt-error" role="alert"></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">キャンセル</button><button type="button" class="btn primary" id="ttCommit" disabled>新規イベントとして追加</button></div>`;
          const commit=$('#ttCommit');$('#ttConfirmed').onchange=()=>{commit.disabled=!$('#ttConfirmed').checked;};
          commit.onclick=()=>{
            if(!draft||!$('#ttConfirmed').checked)return;
            const name=$('#ttName').value.trim(),date=$('#ttDate').value,venue=$('#ttVenue').value.trim(),error=$('#ttCommitError');
            if(!name||!validTimetableDate(date)){error.textContent='イベント名と実在する開催日を入力してください。';return;}
            if(state.events.some(e=>e.name===name&&e.date===date)&&!confirm('同じ名前・開催日のイベントが存在します。重複する可能性がありますが、別イベントとして追加しますか？'))return;
            commit.disabled=true;
            const queues=draft.items.map(item=>({id:uid(),title:item.title,plannedAt:item.start,dayOffset:item.dayOffset,duration:item.duration,noDuration:item.type!=='slot',isTerminal:item.type==='terminal',terminalDeadline:item.type==='terminal'?item.start:'',terminalDeadlineDayOffset:item.type==='terminal'?item.dayOffset:0,startMode:'time',area:item.area,note:[item.genre?'ジャンル: '+item.genre:'',item.vj?'VJ: '+item.vj:'',item.note,item.needsReview?'[AI読取・要確認]':''].filter(Boolean).join('\n'),locked:item.type==='terminal',state:'pending'}));
            const event=normalize({events:[{id:uid(),name,date,venue,autoAdvance:false,queues,recipes:[],closedAt:null}]}).events[0];
            if(event.queues.length)event.queues[0].state='active';
            const next={...state,events:[...state.events,event],activeEventId:event.id,ui:{...state.ui,view:'queue'}};
            try{localStorage.setItem(APP_KEY,JSON.stringify(next));}catch{error.textContent='端末に保存できませんでした。既存データは変更していません。バックアップを確保し、空き容量やブラウザの保存設定を確認してください。';commit.disabled=false;return;}
            state=next;previousAutoEvent='';closeModal();render();showToast(`${queues.length}件を新規イベントに追加しました。確認後、イベント設定で自動進行をONにできます。`);
          };
        };
        $('#ttCheck').onclick=check;
        fileInput.onchange=async()=>{
          const sequence=++readSequence,file=fileInput.files?.[0];invalidate();jsonInput.value='';if(!file)return;
          if(file.size>2*1024*1024){errorBox.textContent='JSONファイルは2MB以下にしてください。';return;}
          try{const text=await file.text();if(sequence!==readSequence||!fileInput.isConnected)return;jsonInput.value=text;check();}catch{if(sequence===readSequence)errorBox.textContent='ファイルを読み込めませんでした。もう一度選択してください。';}
          finally{if(sequence===readSequence)fileInput.value='';}
        };
        $('#ttCopy').onclick=async()=>{try{await navigator.clipboard.writeText(TT_PROMPT);showToast('AIへの指示文をコピーしました。');}catch{$('#ttPrompt').focus();$('#ttPrompt').select();showToast('指示文を選択しました。コピー操作をしてください。');}};
        $('#ttPromptDownload').onclick=()=>downloadTimetableText(TT_PROMPT,'timetable-ai-prompt.txt','text/plain;charset=utf-8');
        $('#ttSample').onclick=()=>downloadTimetableText(JSON.stringify(timetableSample(),null,2),'freedom-vol20-timetable.json');
      }
      document.addEventListener('click',e=>{if(!STAFF_SHARE_ID&&e.target.closest('[data-tt-action="open"]'))openTimetableImport();});
      function exportData() { const data={format:'event-flow-autoqueue',version:1,exportedAt:new Date().toISOString(),data:state};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`event-flow-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('バックアップを書き出しました。'); }
      function importData(file) { if(!file)return;const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result);if(raw?.format===TT_FORMAT){showToast('タイムテーブルJSONは「AIタイムテーブル読込」から追加してください。既存データは変更していません。');return;}if(!confirm('現在のデータを、読み込むバックアップで置き換えますか？'))return;state=normalize(raw.data||raw);save();render();if(notificationSettings().subscriptionId)syncAllNotificationSchedules(true).catch(error=>{notificationSettings().lastError=error.message;save();});showToast('バックアップを読み込みました。通知を有効化済みなら予定も再同期します。');}catch{showToast('読み込めませんでした。JSONファイルを確認してください。');}};r.readAsText(file); }
      function clearData() { if(!confirm('この端末に保存した全イベントとキューを削除します。元に戻せません。'))return;const cfg=notificationSettings(),events=[...state.events];if(cfg.subscriptionId){events.forEach(event=>notificationApi('/schedule',{clientId:cfg.deviceId,subscriptionId:cfg.subscriptionId,eventId:event.id,schedules:[]}).catch(()=>{}));notificationApi('/unsubscribe',{clientId:cfg.deviceId,subscriptionId:cfg.subscriptionId}).catch(()=>{});}events.forEach(stopSharedEventSilently);state={activeEventId:null,ui:{view:'events'},notifications:defaultNotificationSettings(),events:[]};save();render();showToast('全データと、この端末の未送信通知予定を削除しました。'); }

      const STAFF_VIEW_PREFS_KEY=`event-flow-staff-view:${STAFF_SHARE_ID}`;
      let staffShareTimer=null;
      let latestSharedPayload=null;
      function staffViewPrefs() { try{return {showCompleted:false,...JSON.parse(sessionStorage.getItem(STAFF_VIEW_PREFS_KEY)||'{}')};}catch{return {showCompleted:false};} }
      function saveStaffViewPrefs(next) { sessionStorage.setItem(STAFF_VIEW_PREFS_KEY,JSON.stringify(next)); }
      function toggleCompletedTimeline() { const prefs=staffViewPrefs();saveStaffViewPrefs({...prefs,showCompleted:!prefs.showCompleted});if(latestSharedPayload)renderStaffReadonly(latestSharedPayload); }
      function sharedCueMarkup(label,cue,kind='') { if(!cue)return `<article class="staff-share-cue ${kind}"><span>${esc(label)}</span><h2>後続なし</h2><p>進行表の終端です。</p></article>`;return `<article class="staff-share-cue ${kind}"><span>${esc(label)}</span><h2>${esc(cue.title)}</h2><div class="staff-share-time">${esc(cue.plannedAt)}</div><p>${esc(cue.status)}　${esc(cue.area)}</p></article>`; }
      function sharedTimelineMarkup(shared) { const prefs=staffViewPrefs(),timeline=Array.isArray(shared.timeline)?shared.timeline:[],completedCount=timeline.filter(item=>item.completed).length,visible=prefs.showCompleted?timeline:timeline.filter(item=>!item.completed),items=visible.length?visible.map(item=>`<li class="staff-timeline-item ${esc(item.state)} ${item.completed?'is-completed':''}"><span class="staff-timeline-marker" aria-hidden="true"></span><time>${esc(item.time)}</time><b>${esc(item.title)}</b><small>${item.state==='active'?'現在':item.state==='skipped'?'スキップ':item.completed?'完了':item.terminal?'締切':'予定'}</small></li>`).join(''):`<li class="staff-timeline-empty">表示する未完了項目はありません。</li>`;return `<section class="staff-timeline-panel" aria-label="進行タイムライン"><div class="staff-timeline-head"><div><span>◇› TIMELINE</span><b>進行表</b></div>${completedCount?`<button type="button" class="staff-completed-toggle" data-staff-action="toggle-completed">${prefs.showCompleted?`完了を隠す (${completedCount})`:`完了を表示 (${completedCount})`}</button>`:''}</div><ol class="staff-timeline">${items}</ol></section>`; }
      function renderStaffReadonly(data) { latestSharedPayload=data;const root=$('#staffShareRoot');if(!root)return;const shared=data.state||{},updated=new Date(Number(data.updatedAt)||Date.now()),updatedText=Number.isNaN(updated.getTime())?'更新時刻不明':`${fmtDate(updated.toISOString().slice(0,10))} ${fullTimeText(updated)}`,closed=shared.closedAt?'終了済み':shared.currentStatus||'進行状態を確認',metricClass=shared.statusKind==='over'?'over':shared.statusKind==='warn'?'warn':'';root.innerHTML=`<header class="staff-share-top"><div class="staff-share-brand"><i>◇</i><div>Event Flow<br><small class="staff-share-kicker">STAFF READ-ONLY</small></div></div><div class="staff-share-updated">${esc(updatedText)}<br><span>自動更新</span></div></header><section class="staff-share-event"><div class="staff-share-kicker">LIVE EVENT STATUS</div><h1>${esc(shared.eventName||'進行表を読み込み中')}</h1><p>${esc(shared.date||'')}　${esc(shared.venue||'')}</p></section><section class="staff-share-grid">${sharedCueMarkup('NOW｜現在',shared.current,'current')}${sharedCueMarkup('NEXT｜次',shared.next,'next')}</section>${sharedTimelineMarkup(shared)}<section class="staff-share-rail"><article class="staff-share-metric ${metricClass}"><span>STATUS</span><b>${esc(closed)}</b></article><article class="staff-share-metric"><span>PROGRESS</span><b>${Number(shared.progress?.done)||0} / ${Number(shared.progress?.total)||0} 件</b></article><article class="staff-share-metric ${shared.closedAt?'':'warn'}"><span>FINAL DEADLINE</span><b>${esc(shared.terminalDeadline||'--:--')}</b></article></section>`; }
      function staffConnectionMarkup(title,copy,error=false) { return `<div class="staff-share-empty ${error?'is-error':''}"><b>${esc(title)}</b><p>${esc(copy)}</p><div class="staff-empty-rail"><i aria-hidden="true"></i>${error?'CONNECTION CHECK':'LIVE CHANNEL CONNECTING'}</div></div>`; }
      function renderStaffShareError(message) { const root=$('#staffShareRoot');if(root)root.innerHTML=staffConnectionMarkup('共有進行表を表示できません',message||'共有が停止されたか、リンクが無効です。主端末の担当者へ確認してください。',true); }
      async function refreshStaffShare() { if(!STAFF_SHARE_ID)return;try{const data=await shareApi(`/share/${encodeURIComponent(STAFF_SHARE_ID)}`,'GET');renderStaffReadonly(data);}catch(error){renderStaffShareError(error.message==='share_not_found'?'共有が停止されたか、リンクが無効です。':'通信を再試行しています。電波状況を確認してください。');} }
      function startStaffReadonlyView() { const app=$('.app');if(!app)return;document.title='Event Flow｜スタッフ進行表';document.body.classList.add('staff-readonly');app.classList.add('staff-share-app');app.innerHTML=`<main class="staff-share-shell" id="staffShareRoot">${staffConnectionMarkup('進行表を読み込んでいます','スタッフ共有へ接続しています。')}</main>`;$('#modalBackdrop')?.remove();$('#toast')?.remove();document.addEventListener('click',event=>{const button=event.target.closest('[data-staff-action]');if(button?.dataset.staffAction==='toggle-completed')toggleCompletedTimeline();});refreshStaffShare();staffShareTimer=setInterval(()=>{if(document.visibilityState!=='hidden')refreshStaffShare();},SHARE_REFRESH_MS);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshStaffShare();});}

      document.addEventListener('click', e=>{ const button=e.target.closest('[data-action]'); if(!button)return; const a=button.dataset.action; const id=button.dataset.id;
        if(a==='close-modal')closeModal(); else if(a==='dismiss-auto'){previousAutoEvent='';render();} else if(a==='toggle-emergency'){state.ui.emergencyView=!state.ui.emergencyView;save();render();showToast(state.ui.emergencyView?'緊急表示に切り替えました。':'通常表示に戻しました。');} else if(a==='add-queue')openQueueForm(); else if(a==='edit-queue')openQueueForm(id); else if(a==='edit-current'){const q=activeQueue(currentEvent());if(q)openQueueForm(q.id);} else if(a==='open-recipe')openRecipeForm('',id); else if(a==='edit-recipe')openRecipeForm(id); else if(a==='toggle-tag')button.classList.toggle('selected'); else if(a==='create-event')openEventForm(); else if(a==='edit-event')openEventForm(id); else if(a==='open-event'){state.activeEventId=id;state.ui.view='field';save();render();} else if(a==='delete-event')deleteEvent(id); else if(a==='delete-queue')deleteQueue(id); else if(a==='move-queue')moveQueue(id,Number(button.dataset.dir)); else if(a==='shift-queues')shiftQueues(Number(button.dataset.min)); else if(a==='shift-now')shiftQueues(0,true); else if(a==='activate-condition')activateCondition(); else if(a==='record-must')recordMustCut(); else if(a==='undo-must')undoMustCut(); else if(a==='complete-no-duration')completeNoDuration(); else if(a==='complete-terminal')completeTerminal(); else if(a==='skip-current')skipCurrent(); else if(a==='save-push-settings')saveNotificationSettings(); else if(a==='enable-push')enablePushNotifications(); else if(a==='disable-push')disablePushNotifications(); else if(a==='test-push')sendTestPushNotification(); else if(a==='start-share')startStaffShare(); else if(a==='show-share-qr')openStaffShareQr(); else if(a==='copy-share')copyStaffShareLink(); else if(a==='sync-share'){const event=currentEvent();if(event)syncStaffShare(event);} else if(a==='stop-share')stopStaffShare(); else if(a==='sync-push')syncAllNotificationSchedules().catch(error=>{notificationSettings().lastError=error.message;save();render();showToast(error.message);}); else if(a==='export')exportData(); else if(a==='import')$('#importFile')?.click(); else if(a==='clear')clearData(); });
      document.addEventListener('change',e=>{if(e.target.id==='importFile')importData(e.target.files?.[0]);});
      document.addEventListener('dblclick',e=>{if(e.target.closest('button,.btn,.icon-btn,.map-link,.nav button,label.settings-line,[data-action]'))e.preventDefault();},{passive:false});
      if(STAFF_SHARE_ID){document.body.classList.remove('finder-ui');startStaffReadonlyView();return;}
      setupConsoleNavigation();
      $$('.nav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
      $('#fontSizeBtn').addEventListener('click',cycleFontScale);
      $('#addButton').addEventListener('click',()=>state.ui.view==='events'?openEventForm():state.ui.view==='recipes'?openRecipeForm():openQueueForm());
      $('#eventSettingsBtn').addEventListener('click',openSettings);
      $('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal();});
      document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
      setInterval(()=>{const c=$('#clock');if(c)c.textContent=fullTimeText(new Date());handoffIfDue();if(state.ui.view==='field'){refreshNextThirtyBar();refreshFinderTimer();}},1000);
      registerPwa();
      render();
    })();
  </script>
